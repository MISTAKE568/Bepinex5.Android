[Caching]

EnableAssemblyCache = true

[Chainloader]

HideManagerGameObject = false

[Harmony.Logger]

LogChannels = Warn, Error

[Logging]

UnityLogListening = true

LogConsoleToUnityLog = false

PreloaderConsoleOutRedirection = true

[Logging.Console]

Enabled = false

PreventClose = false

ShiftJisEncoding = false

StandardOutType = Auto

LogLevels = All

DisplayedLogLevel = All

[Logging.Disk]

WriteUnityLog = false

AppendLog = false

Enabled = true

LogLevels = All

DisplayedLogLevel = All

[Preloader]

# Avoid terminal and reflection hooks during Android startup.
ApplyRuntimePatches = false

# Use Cecil so patch generation does not depend on Unity Mono's Reflection.Emit implementation.
HarmonyBackend = cecil

DumpAssemblies = false

LoadDumpedAssemblies = false

BreakBeforeLoadAssemblies = false

ShimHarmonySupport = false

[Preloader.Entrypoint]

# The JNI bootstrap starts Chainloader, so no game assembly entrypoint needs injection.
Assembly = _none.dll

Type = MonoBehaviour

Method = .cctor
